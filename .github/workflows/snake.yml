name: cards fofos do perfil 🐍🎀

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cards de contribuições e linguagens
        run: |
          mkdir -p dist
          node .github/scripts/contrib-card.mjs ${{ github.repository_owner }} dist/contrib-card.svg
          node .github/scripts/langs-card.mjs ${{ github.repository_owner }} dist/langs-card.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#d6567a&color_dots=#fff0f3,#ffdde3,#ffc2d4,#ffb6c1,#ff8fab
            dist/snake-dark.svg?color_snake=#ffb6c1&color_dots=#2b1a20,#5c2a3a,#8f3f58,#d6567a,#ffb6c1&color_background=#0d1117

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
