<svg width="467" height="195" viewBox="0 0 467 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="linguagens favoritas">
<style>
.t{font:600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#d6567a}
.l{font:600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#9b3a52}
.p{font:400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#c27a8e}
.seg{animation:fill .8s ease-out both;transform-box:fill-box;transform-origin:left}
.it{animation:show .5s ease-out both}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes show{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.seg,.it{animation:none}}
</style>
